<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Fresh Pages</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: var(--site-font-family, "Inter", sans-serif);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at top left, rgba(226,58,87,0.18), transparent 40%),
          radial-gradient(ellipse at bottom right, rgba(107,92,255,0.2), transparent 42%),
          var(--bg);
      color: var(--text);
      transition: background 0.3s;
    }

    /* --- LOGIN CARD --- */
    .login-card {
      width: 100%;
      max-width: 400px;
      background: radial-gradient(ellipse at top right, rgba(107,92,255,0.13), transparent 42%),
          linear-gradient(145deg, var(--card), var(--surface));
      padding: 40px;
      border-radius: 12px;
      border: 1px solid rgba(226,58,87,0.2);
      box-shadow: 0 24px 70px rgba(2,6,23,0.38);
      color: var(--text);
      margin: 20px;
    }

    .login-card h2 {
      margin-top: 0;
      text-align: center;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .login-card label {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box; /* Fixes padding overflow issues */
      border-radius: 6px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      color: var(--text);
      font-size: 1rem;
    }

    /* --- PASSWORD TOGGLE --- */
    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
      user-select: none;
    }

    /* --- BUTTON --- */
    .login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 30px;
      background: linear-gradient(100deg, var(--accent), var(--accent-2));
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    /* --- ERROR MESSAGE --- */
    #loginError {
      margin-top: 15px;
      color: #ff9eac;
      font-size: 14px;
      text-align: center;
      display: none;
      background: rgba(226, 58, 87, 0.12);
      padding: 10px;
      border-radius: 4px;
    }

    /* --- SIGNUP LINK --- */
    .signup-link {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
    }

    .signup-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .sidebar-nav {
        /* Basic hiding/styling for standalone login page if you don't want the full sidebar here */
        display: none; 
    }
  </style>
</head>

<body>

  <div class="login-card">
    <h2>Welcome Back</h2>

    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>

      <label for="loginPassword">Password</label>
      <div class="password-wrapper">
        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">Show</button>
      </div>
      
    <button type="submit" id="login-btn" class="auth-btn">Log In</button>

      <p id="loginError">Incorrect email or password.</p>
      <button type="button" id="forgotPasswordLink" class="forgot-password-link">Forgot password?</button>
    </form>

    <div class="signup-link">
      New here? <a href="signup.html">Create an account</a>
    </div>
    
    <div class="signup-link">
        <a href="index.html">← Back to Home</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <!-- Firebase Auth sends the reset link directly to the account email. -->
  <div id="forgotModal" class="forgot-modal" role="dialog" aria-modal="true" aria-labelledby="forgotModalTitle">
    <div class="forgot-modal-card">
      <button type="button" id="closeForgotModal" class="forgot-modal-close" aria-label="Close">&times;</button>
      <h3 id="forgotModalTitle">Reset Password</h3>
      <p class="forgot-modal-hint">We’ll email you a secure password reset link.</p>
      <label for="forgotEmailInput">Account email</label>
      <input type="email" id="forgotEmailInput">
      <button type="button" id="forgotEmailBtn" class="auth-btn">Send reset link</button>
      <div id="forgotEmailMsg" class="forgot-email-message" role="status"></div>
    </div>
  </div>
  <script src="theme-engine.js"></script>
  <script src="script.js"></script>

</body>
</html>
