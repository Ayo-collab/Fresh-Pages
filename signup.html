<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Fresh Pages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <img src="fresh-pages-mark.svg" alt="Fresh Pages" class="auth-logo">
            <h1>Make a little space for your stories</h1>
            <p>Join the community and start creating</p>
        </div>

        <form id="signup-form">
    <div class="input-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="name" placeholder="Your name" autocomplete="name" maxlength="100" required>
    </div>

    <div class="input-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="birthdate" autocomplete="bday" required aria-describedby="dobHint">
        <small id="dobHint" class="input-hint">Fresh Pages is for ages 12+. If you’re 12, use it with a parent or guardian.</small>
</div>

    <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" maxlength="254" required>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="new-password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
    </div>

    <button type="submit" class="auth-btn">Create account</button>
    <p id="signupError" class="auth-error" role="alert" aria-live="polite" hidden></p>
</form>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html">Log in</a></p>
            <p><a href="index.html">Back to Fresh Pages</a></p>
        </div>
    </div>
</div>

<!-- Firebase v8 SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="theme-engine.js"></script>
<script src="./script.js"></script>

</body>
</html>
