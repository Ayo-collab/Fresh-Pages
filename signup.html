<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – Fresh Pages</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <img src="fresh-pages-mark.svg" alt="Fresh Pages" class="auth-logo">
            <h1>Join Fresh Pages</h1>
            <p>Create your account to start writing</p>
        </div>

        <form id="signup-form">
    <div class="input-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Ayomi Oyetade" autocomplete="name" required>
    </div>

    <div class="input-group">
    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" autocomplete="bday" required>
</div>

    <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
    </div>

    <button type="submit" class="auth-btn">Sign Up</button>
    <p id="signupError" class="auth-error" role="alert" hidden></p>
</form>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html">Log In</a></p>
        </div>
    </div>
</div>

<!-- Firebase v8 SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="theme-engine.js"></script>
<script src="./script.js"></script>

</body>
</html>
